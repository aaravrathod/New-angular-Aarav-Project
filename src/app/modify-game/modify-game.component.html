<h1>modify-game works!</h1>
<form [formGroup]="gameForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <!--Added auto focus to the ID field , which changes colour of backGround Field-->
    <label for="id" appAutoFocus>ID</label>
    <input type="number" id="id" formControlName="id" [appAutoFocus]="'lightblue'" />
  </div>
 <!--Added directive appHoverHiglight, to change the colour when hovered over the text field-->
  <div class="form-group">
    <label for="title">Game Name</label>
    <input type="text" id="title" formControlName="title" [appHoverHighlight]="'yellow'" />
  </div>
  <!--Added directive appHoverHiglight, to change the colour when hovered over the text field-->
  <div class="form-group">
    <label for="developers">Developers</label>
    <input type="text" id="developers" formControlName="developers" [appHoverHighlight]="'Orange'"/>
  </div>
  <!--Added directive appHoverHiglight, to change the colour when hovered over the text field-->
  <div class="form-group">
    <label for="release_date">release date</label>
    <input type="text" id="release_date" formControlName="release_date" [appHoverHighlight]="'blue'" />
  </div>
  <!--Added directive appHoverHiglight, to change the colour when hovered over the text field-->
  <div class="form-group">
    <label for="character">character</label>
    <input type="text" id="character" formControlName="character" [appHoverHighlight]="'green'"/>
  </div>

  <button type="submit">Update</button>




  <button type="button" (click)="navigateToGameList()">Back to List</button>
</form>
