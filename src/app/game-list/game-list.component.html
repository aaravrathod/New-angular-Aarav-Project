<mat-card class="game-card">
<mat-card-header>
  <mat-card-title><h1>Game Details</h1></mat-card-title>
</mat-card-header>

<mat-card-content>
<div *ngFor="let game of game_List" [appHoverHighlight]=" 'cornflowerblue' " >
  <img ngSrc="{{game.image}}"  width="80" height="80" priority>


   <h1>ID:{{game.id}}</h1>
  <!--Added a lower case pipe-->
  <h1>TITLE:{{game.title | lowercase}}</h1>
  <h1>CHARACTER:{{game.character}}</h1>
  <!--Added a date pipe -->
  <h1>RELEASE DATE:{{game.release_date | date :'short'}}</h1>

  <!--Added a currency pipe-->
  <h1>PRICE:{{game.price | currency}}</h1>
  <!--Added custom pipe-->
  <h1>CONCATENATE:{{game | concatenate}}</h1>
  <br>
  <button mat-fab extended type="button" (click)="onEdit()" routerLink="/modify-game" routerLinkActive="active"  [appHoverHighlight]=" 'white' ">Edit</button>
  <!-- Delete Button (Always Displayed Now) -->
  <button mat-fab extended type="button" (click)="onDelete(game) " [appHoverHighlight]=" 'red' ">Delete</button>
</div>

</mat-card-content>
</mat-card>
